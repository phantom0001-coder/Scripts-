name = "primez-reverser"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "c744ddf2a5e5e69a9de254ee0546789b"

[vars]
ENVIRONMENT = "production"
DISCORD_PUBLIC_KEY = "f3f27f62b5efbd0c758d0fb7adfa053a02a5f7afca029f00e45e18baf8d2887e"
DISCORD_APPLICATION_ID = "1569712748575723562"
# Full engine backend: Render service hosting PRIMEz-Reverser/server.py
# (repo: Primez-REL). Leave empty for edge-only regex mode.
REVERSER_BACKEND_URL = "https://primez-rel.onrender.com"
# Failover backend, tried when the primary fails: the older primez-rel-api
# service (tracks Scripts- main, serves the same server.py once its start
# command is fixed). Swap the two URLs any time to change priority.
REVERSER_BACKEND_URL_FALLBACK = "https://primez-rel-api.onrender.com"

# Required secret (do NOT commit it here) — must match the REVERSER_API_KEY
# environment variable on the Render service:
#   npx wrangler secret put REVERSER_API_KEY

# Keep-alive cron: pings the backend every 10 minutes so the Render free
# tier never sleeps (free instances sleep after 15 min of no traffic).
[triggers]
crons = ["*/10 * * * *"]
